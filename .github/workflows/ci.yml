name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Dev tools only. The plugin's own composer install needs the private admin-shell repo.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
          tools: composer

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Install PHP lint and test tools
        run: |
          composer install --no-interaction --prefer-dist -d dev/tools/lintphp
          composer install --no-interaction --prefer-dist -d dev/tools/phpunit

      - name: Lint (eslint + prettier)
        run: pnpm lint

      - name: Lint PHP (phpcs)
        run: pnpm lint:php

      - name: Test (vitest)
        run: pnpm test

      - name: Test PHP (phpunit)
        run: pnpm test:php

      - name: Build
        run: pnpm build
